# Конфиг для Toolforge (путь в envvar APPARITOR_CONFIG). Секретов здесь нет.
base_url = "https://apparitor.toolforge.org"
repo_url = "https://github.com/ruwiki/apparitor"
dry_run = true                       # только отчёты, ролей не трогать
guilds = [223183550965481473, 1044474820089368666, 1071563548678959134]

[db]
kind = "toolsdb"

[admit]
min_edits = 0        # 0 = не проверять; по readme сообщества критерий = учётка есть и не заблокирована
min_age_days = 0
reject_blocked = true

# --- Сообщество Викимедиа ---
[guild.223183550965481473]
report_channel_id = 995099313648701600   # #moderbot — только модераторы
report_names = true                       # закрытый канал: в отчёте связка ник ↔ вики-аккаунт
remove_on_confirm = ["🆕 new user"]
commands = ["status", "sync", "link", "audit"]   # /login, /verify, /confirm здесь не регистрируем: проверку даёт /auth WikiAuthBot2
gate_watch = true                         # непроверенных искать в WikiAuthBot (ключ WIKIAUTHBOT_KEY_223183550965481473)
import_links = true                       # связки всех участников из WikiAuthBot в свою БД (запись только в БД бота)
roles_channel_id = 768773664949927946     # #roles: здесь сообщения бота с реакциями
optout_channels = [353333123381067777, 778916107893473310]   # #readme, #announcements: выход реакцией 📭, сообщения в личку
welcome_channel_id = 728220635905523782    # #welcome; после перестройки прав — новый канал
welcome_text = '''<:wikipetan:330603892725252096> Добро пожаловать в чат сообщества Викимедиа!
{mention}, пожалуйста, сообщите ваш никнейм в Википедии.

<:logo:330789827559817229> Верифицировать (подтвердить) вашу учётную запись Википедии вы можете через бота или связавшись с модераторами чата.

:link: Подтвердить учётную запись можно командой `/auth` (бот WikiAuthBot): она связывает вашу учётную запись Википедии с Discord.

<:puzzle:330791376989978624> Если вы новый участник и у вас есть краткий вопрос — смело задавайте его, здесь постараются помочь и ответить!

:red_circle: Заметьте, что для доступа к серверу у вас должен быть флаг автопатрулируемого (см. ВП:АПАТ), либо год стажа и более ста правок.'''
farewell_texts = ["возвращайся!", "будем ждать!", "мы уже заскучали!", "приходи ещё!", "удачи!"]
join_roles = ["🆕 new user"]               # Carl выдаёт через 240 с после входа (журнал аудита: 8 из 8 с известным входом)
join_delay = 240                           # 0 = сразу; решение хозяина, пока повторяем Carl
sticky_days = 730
# Доска лучших сообщений (замена Starboard): в #memes, при 7 звёздах (по данным доски: минимум 7). Источники: каналы категорий
# «Общие» и «Проекты Викимедиа», которые видит роль «all» (закрытый канал в этих категориях не берётся), и #meta по id.
# Starboard брал и из закрытых #pro-growth, #pro-science; здесь нет.
board_channel_id = 733949614385791026
board_threshold = 7
board_categories = [360741077193326592, 607243740607807494]
board_sources = [223183550965481473]
sticky_skip = ["+👮 #admins", "+👮 #wikibooks", "+👮 #wikidata", "+👮 #wikinews", "+👮 #wikisource", "+👮 #wiktionary", "+👮 #tech", "+👮 #copyright", "+👮 #voice", "#admins", "#requests-fast", "+👮 emoji"]   # чёрный список возврата Carl (autoroles.json, 12 из 14: две роли удалены)
[guild.223183550965481473.admit]          # правило из приветствия в #welcome: АПАТ либо год стажа и более ста правок
min_edits = 101
min_age_days = 365
reject_blocked = true
apat_suffices = true
[guild.223183550965481473.track_categories]   # новые каналы здесь получают роль доступа и реакцию; префикс как у ролей сервера
"360741077193326592" = "+ #"              # Общие
"607243740607807494" = "+ #"              # Проекты Викимедиа
"360739274045390848" = "#"                # Тематические
[guild.223183550965481473.roles]         # admitted/apat — условия; остальные ключи = группы рувики
admitted = "✔"
apat = ""
sysop = "Администратор"
bureaucrat = "Бюрократ"
interface-admin = "Администратор интерфейса"
engineer = "Инженер"
closer = "Подводящий итоги"
closer-plus = "Полномочный подводящий итоги"   # статус из JSON гаджета markadmins (ПИ+)
vrts = ""                                     # роль VRT на сервере есть; вести ли её ботом — решение владельца
steward = "Стюард"

