# Конфиг для Toolforge (путь в envvar APPARITOR_CONFIG). Секретов здесь нет.
base_url = "https://apparitor.toolforge.org"
repo_url = "https://github.com/ruwiki/apparitor"
dry_run = true                       # только отчёты, ролей не трогать
guilds = [223183550965481473, 1044474820089368666, 1071563548678959134]

[db]
kind = "toolsdb"

[admit]
min_edits = 0        # 0 = не проверять; по readme сообщества критерий = учётка есть и не заблокирована
min_age_days = 0
reject_blocked = true

