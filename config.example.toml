# Скопировать в config.toml. Токен бота — в .env (DISCORD_TOKEN=...), не сюда.
db = "apparitor.db"
guild_id = 0                 # сервер для отладки; 0 = команды глобальные (появляются до часа)
log_channel_id = 0           # служебный канал для отчётов; 0 = не писать

# Критерии впуска (аналог Черепашки). Допущение 26.09, уточнить.
[admit]
min_edits = 100
min_age_days = 30
reject_blocked = true

# Имя роли Discord <- условие. Роли должны существовать и стоять НИЖЕ роли бота.
[roles]
admitted = "участник"        # выдаётся всем прошедшим проверку
sysop = "админ"
apat = "АПАТ"
arbcom = "арбитр"
