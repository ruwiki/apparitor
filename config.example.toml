# Скопировать в config.toml. Токен бота — в .env (DISCORD_TOKEN=...), не сюда.
db = "apparitor.db"
base_url = ""                 # https://apparitor.toolforge.org — для ссылок /auth
repo_url = ""
report_channel_id = 0         # служебный канал для отчётов о действиях
dry_run = true                # true = только отчёты, ролей не трогать
remove_on_confirm = []        # роли, снимаемые после подтверждения (напр. "🆕 new user")
guild_id = 0                 # сервер для отладки; 0 = команды глобальные (появляются до часа)
log_channel_id = 0           # служебный канал для отчётов; 0 = не писать

# Критерии впуска. 0 = не проверять.
[admit]
min_edits = 100
min_age_days = 30
reject_blocked = true

# Имя роли Discord <- условие; "" = не использовать. Роли должны стоять НИЖЕ роли бота.
[roles]
interface-admin = ""
engineer = ""
closer = ""
steward = ""
admitted = "участник"        # всем прошедшим проверку
sysop = "админ"
apat = "АПАТ"
arbcom = "арбитр"
checkuser = "ЧЮ"
bureaucrat = ""
