# Скопировать в config.toml. Секреты — в .env (DISCORD_TOKEN, OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET), не сюда.
base_url = ""                 # https://apparitor.toolforge.org — для ссылок /auth
repo_url = ""
dry_run = true                # true = только отчёты, ролей не трогать
guilds = [0]                  # id серверов, на которых работает бот

[db]
kind = "sqlite"               # toolsdb (ToolsDB на Toolforge, креды из envvars) | sqlite (только локально)
sqlite_path = "apparitor.db"

[admit]                       # критерии впуска; 0 = не проверять
min_edits = 0
min_age_days = 0
reject_blocked = true

[guild.0]                     # секция на каждый сервер из guilds
report_channel_id = 0         # служебный канал для отчётов о действиях
report_names = false          # true только для закрытого канала: в отчёте связка ник ↔ вики-аккаунт и флаги
remove_on_confirm = []        # роли, снимаемые после подтверждения (напр. "🆕 new user")
[guild.0.roles]               # имя роли <- условие; "" = не использовать; роли должны стоять НИЖЕ роли бота
admitted = "участник"         # всем прошедшим проверку
apat = "АПАТ"                 # autoreview ∨ editor ∨ sysop
sysop = "админ"               # дальше ключи = группы рувики (+ глобальные: steward)
arbcom = "арбитр"             # группа рувики + действующий состав из JSON гаджета markadmins
checkuser = ""
closer-plus = ""              # статусы без техгруппы, из того же JSON: closer-plus (ПИ+), vandalfighter,
vandalfighter = ""            # clerk, techdeleter (ТУ), vrts
